# Genel üretim parametreleri.
# Kaynak: docs/03_olay_katalogu.md. Sayısal değerler [ÖNERİ].

[series]
start = "2024-01"
months = 36
commentable_from = "2025-01"
fixed_cost_inflation_pct = 2.0
# Tamamen amorti olan varlıkların çıkışı ve kredi geri ödemesi: yeni yatırımlar (E08) birikmesin diye
# AfA ve faiz tabanı her yıl bu oranda azalır.
afa_runoff_pct = 6.0
zins_runoff_pct = 10.0
noise_sd_pct = 1.5
noise_clip_pct = 4.0

[variants]
size_factor = [0.6, 1.6]
employees_bounds = [20, 200]
quota_rel = 0.10
material_quota_rel = 0.03
season_amplitude = [0.7, 1.3]
trend_pct = [-2.0, 6.0]
name_stems = ["Modell", "Vorlage", "Schema", "Demo", "Probe", "Typus", "Exemplar", "Prototyp", "Musterbau", "Beispielwerk", "Vorbild", "Entwurf"]

[notes]
documented_share = 0.70
season_note_share = 0.70
distractor_month_share = 0.12
number_share = 0.50

[events]
near_threshold_share = 0.20
max_events_per_line_month = 2
# Dolu bir satır-aya ikinci olay yalnızca bu olasılıkla kabul edilir (hedef: olayların ~%10'u çakışır).
overlap_accept_share = 0.3
# Geçici: V6 beklentisi için satış endeksinin önceki aya göre en az bu kadar değişmesi gerekir.
# Anlamlılık eşikleri [AÇIK] olduğundan eşikler belirlenince yeniden ayarlanacak.
season_flag_min_change_pct = 10.0

# Varyant başına yıllık sıklık [min, max] (docs/03, Bölüm 4)
# Kalibrasyon (14.10.2026): Marjlar seri boyunca çökmesin diye E01, E07 ve E04'ün kalıcı payı azaltıldı,
# E03 aralığı daraltıldı, E06 sıklığı artırıldı (docs/00, karar turu 3).
[events.per_year]
E01 = [1, 3]
E02 = [1, 2]
E03 = [1, 1]
E04 = [1, 2]
E05 = [0, 1]
E06 = [2, 4]
E08 = [0, 1]
E10 = [0, 1]
E11 = [1, 2]
E12 = [2, 3]

# Bütün seri boyunca sıklık [min, max]
[events.per_series]
E07 = [0, 1]
E09 = [0, 1]

# Büyüklük aralıkları (docs/03, Bölüm 3)
[events.magnitude]
E01_pct_employees = [2.0, 5.0]
E02_pct_employees = [2.0, 5.0]
E03_pct = [2.0, 4.0]
E04_pp = [2.0, 6.0]
E04_temporary_share = 0.8
E04_temporary_months = [3, 6]
E05_pct = [2.0, 6.0]
E06_pct = [10.0, 30.0]
E06_months = [1, 3]
E07_pct = [5.0, 15.0]
E08_afa_pct = [10.0, 30.0]
E08_zins_pct = [10.0, 40.0]
E08_useful_life_years = 8
E09_pct = [8.0, 30.0]
E10_pct_of_umsatz = [0.5, 3.0]
E11_extra_multiple = [1.0, 4.0]
E11_two_month_share = 0.3
E12_extra_multiple = [2.0, 7.0]
E13_pct = [30.0, 60.0]
E14_pct = [50.0, 90.0]
E15_jan_multiple = [5.0, 8.0]
E18_pct = [15.0, 40.0]
E18_material_share = 0.7
