# Dengelenmiş V2 test kümesi (docs/00, karar turu 4, karar 1d; docs/04, Bölüm 8).
# Ana veri gerçekçi kalır. Bu profil yalnızca "V2 adayı ayrımı" metriği için ayrı bir küme üretir.
# Kullanım:
#   python -m generator --profile v2_balanced --variants 10 --first-variant 50 --seed 4242 \
#       --out data/synthetic/v2_balanced_seed4242

# A2'de stok değişimi ana veride %80 olasılıkla yalnızca envanterde kaydedilir. O zaman
# neredeyse her ay bir çarpıklık ayı olur ve "notla açıkla" (cite) vakası kalmaz.
[archetypes.A2.practices]
p3_bestand = 0.2

# Fiyat olayları daha sık: cite adayı ayların sayısı artar (A2'de 10 varyantta ~27 cite ayı).
[generation.events.per_year]
E04 = [2, 4]
E05 = [1, 3]

[balanced_v2]
include_either = true
