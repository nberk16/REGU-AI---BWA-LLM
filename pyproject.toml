[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwa-llm"
version = "0.1.0"
description = "BWA-Yorumlayıcısı: sentetik veri üreteci ve LLM bileşenleri (eğitim/portfolyo projesi)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["generator*", "facts*"]

[tool.setuptools.package-data]
generator = ["config/*.toml", "config/profiles/*.toml"]
facts = ["config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
